<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal AI - Ultra Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --gemini-blue: #1a73e8; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #8884; border-radius: 10px; }
        #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: white; z-index: 9999; }
        .dark #loading { background: #131314; color: white; }
        .sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .sidebar.open { transform: translateX(0); } }
        .glass-input { backdrop-filter: blur(10px); background: rgba(240, 244, 249, 0.8); }
        .dark .glass-input { background: rgba(30, 31, 32, 0.8); }
        .typing-cursor::after { content: '▋'; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        pre { position: relative; background: #1e1e1e !important; color: #d4d4d4; padding: 1.5rem 1rem 1rem; border-radius: 12px; margin: 1rem 0; overflow-x: auto; }
        pre::before { content: 'CODE'; position: absolute; top: 4px; left: 12px; font-size: 10px; color: #888; }
    </style>
</head>
<body class="bg-[#f8fafd] dark:bg-[#131314] text-gray-900 dark:text-gray-100 transition-colors duration-300">

    <div id="loading">
        <div class="text-center">
            <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="font-medium animate-pulse">Powering up AI Modules...</p>
        </div>
    </div>

    <div id="app" class="hidden flex h-[100dvh] overflow-hidden">
        <aside id="sidebar" class="sidebar fixed md:relative h-full w-72 bg-[#f0f4f9] dark:bg-[#1e1f20] p-4 flex flex-col z-50">
            <div class="flex items-center justify-between mb-8">
                <button onclick="createNewChat()" class="flex items-center gap-3 bg-[#dde3ea] dark:bg-[#333537] hover:brightness-95 px-5 py-3 rounded-2xl transition-all w-full font-semibold shadow-sm">
                    <span class="text-xl">+</span> New Chat
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto space-y-2 pr-2" id="chatHistory"></div>

            <div class="mt-auto pt-4 space-y-1 border-t dark:border-gray-700">
                <button onclick="openSettings()" class="flex items-center gap-3 w-full p-3 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800 transition">⚙️ Configuration</button>
                <button onclick="toggleDarkMode()" class="flex items-center gap-3 w-full p-3 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800 transition">🌗 Toggle Theme</button>
                <button onclick="clearAllData()" class="flex items-center gap-3 w-full p-3 rounded-xl hover:bg-red-100 dark:hover:bg-red-900/30 text-red-500 transition">🧹 Reset App</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col relative min-w-0">
            <header class="h-16 flex items-center justify-between px-6 border-b dark:border-gray-800">
                <button onclick="toggleSidebar()" class="md:hidden p-2 text-2xl">☰</button>
                <div class="flex gap-4 overflow-x-auto no-scrollbar py-2">
                    <span class="px-3 py-1 rounded-full border text-xs whitespace-nowrap opacity-60">Text-to-Image</span>
                    <span class="px-3 py-1 rounded-full border text-xs whitespace-nowrap opacity-60">Code Assistant</span>
                    <span class="px-3 py-1 rounded-full border text-xs whitespace-nowrap opacity-60">STT/TTS</span>
                </div>
            </header>

            <div id="chatDisplay" class="flex-1 overflow-y-auto p-4 md:px-12 lg:px-24 space-y-8 scroll-smooth">
                <div id="welcomeScreen" class="h-full flex flex-col items-center justify-center text-center max-w-2xl mx-auto py-20">
                    <div class="w-20 h-20 mb-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 animate-pulse"></div>
                    <h1 class="text-5xl font-bold mb-6 tracking-tight">Universal AI</h1>
                    <div class="grid grid-cols-2 gap-4 text-left text-sm">
                        <div class="p-4 border rounded-2xl">💡 "Generate a 3D avatar prompt"</div>
                        <div class="p-4 border rounded-2xl">💻 "Write a Python API scraper"</div>
                    </div>
                </div>
            </div>

            <div class="p-4 lg:pb-8">
                <div class="max-w-4xl mx-auto">
                    <div class="glass-input rounded-[32px] p-2 shadow-2xl border dark:border-gray-700">
                        <textarea id="userInput" rows="1" placeholder="Ask anything..." class="bg-transparent border-none focus:ring-0 p-4 w-full resize-none text-lg max-h-60" oninput="autoResize(this)"></textarea>
                        
                        <div class="flex items-center justify-between px-3 pb-2">
                            <div class="flex items-center gap-1">
                                <button onclick="startSTT()" id="micBtn" class="p-3 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-full transition" title="Voice to Text">🎙️</button>
                                <button onclick="triggerFile()" class="p-3 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-full transition" title="Image to Image/Video">🖼️</button>
                                <input type="file" id="fileInput" class="hidden" accept="image/*">
                                <div id="statusTag" class="text-[10px] uppercase font-bold text-blue-500 ml-2"></div>
                            </div>
                            
                            <button id="sendBtn" onclick="sendMessage()" class="bg-blue-600 text-white w-12 h-12 rounded-full hover:scale-105 active:scale-95 transition flex items-center justify-center shadow-lg">
                                <svg class="w-6 h-6 rotate-90" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="sidebarOverlay" class="fixed inset-0 bg-black/40 hidden z-40" onclick="toggleSidebar()"></div>
    
    <div id="settingsModal" class="fixed inset-0 bg-black/70 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white dark:bg-[#1e1f20] rounded-3xl p-8 w-full max-w-lg shadow-2xl transform transition-all">
            <h2 class="text-2xl font-bold mb-6">System Architecture</h2>
            <div class="space-y-5">
                <div>
                    <label class="text-xs font-bold opacity-50 block mb-2">OPENROUTER API KEY</label>
                    <input type="password" id="apiKey" class="w-full p-4 rounded-2xl bg-gray-100 dark:bg-gray-800 border-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="text-xs font-bold opacity-50 block mb-2">PRIMARY MODEL</label>
                    <input type="text" id="modelName" class="w-full p-4 rounded-2xl bg-gray-100 dark:bg-gray-800 border-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="text-xs font-bold opacity-50 block mb-2">SYSTEM PROMPT (GLOBAL)</label>
                    <textarea id="systemPrompt" rows="3" class="w-full p-4 rounded-2xl bg-gray-100 dark:bg-gray-800 border-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
            </div>
            <div class="mt-8 flex gap-3">
                <button onclick="closeSettings()" class="flex-1 py-4 font-bold opacity-60 hover:opacity-100">Cancel</button>
                <button onclick="saveSettings()" class="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-lg shadow-blue-500/30">Initialize</button>
            </div>
        </div>
    </div>

    <script>
        // --- State ---
        const state = {
            apiKey: localStorage.getItem('ua_key') || '',
            model: localStorage.getItem('ua_model') || 'google/gemini-pro-1.5-exp:free',
            systemPrompt: localStorage.getItem('ua_system') || 'You are an omni-capable AI. If the user asks for images/videos/music, describe the prompt details vividly. Use markdown for code.',
            history: JSON.parse(localStorage.getItem('ua_history')) || [],
            currentChatId: null,
            isDark: localStorage.getItem('ua_theme') !== 'light',
            isStreaming: false
        };

        // --- Selectors ---
        const chatDisplay = document.getElementById('chatDisplay');
        const userInput = document.getElementById('userInput');
        const historyList = document.getElementById('chatHistory');
        const micBtn = document.getElementById('micBtn');

        // --- Initialization ---
        window.onload = () => {
            applyTheme();
            renderHistory();
            document.getElementById('apiKey').value = state.apiKey;
            document.getElementById('modelName').value = state.model;
            document.getElementById('systemPrompt').value = state.systemPrompt;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('app').classList.remove('hidden');
        };

        function applyTheme() {
            document.documentElement.classList.toggle('dark', state.isDark);
            localStorage.setItem('ua_theme', state.isDark ? 'dark' : 'light');
        }

        function toggleDarkMode() { state.isDark = !state.isDark; applyTheme(); }

        // --- Logic ---
        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 240) + 'px';
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('hidden');
        }

        function openSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }

        function saveSettings() {
            state.apiKey = document.getElementById('apiKey').value;
            state.model = document.getElementById('modelName').value;
            state.systemPrompt = document.getElementById('systemPrompt').value;
            localStorage.setItem('ua_key', state.apiKey);
            localStorage.setItem('ua_model', state.model);
            localStorage.setItem('ua_system', state.systemPrompt);
            closeSettings();
        }

        function createNewChat() {
            state.currentChatId = Date.now();
            state.history.unshift({ id: state.currentChatId, title: 'New Conversation', messages: [] });
            renderHistory();
            renderMessages();
            if(window.innerWidth < 768) toggleSidebar();
        }

        function renderHistory() {
            historyList.innerHTML = state.history.map(chat => `
                <div onclick="loadChat(${chat.id})" class="group flex items-center justify-between p-3 rounded-xl cursor-pointer transition-all ${state.currentChatId === chat.id ? 'bg-[#dde3ea] dark:bg-[#333537]' : 'hover:bg-gray-200 dark:hover:bg-gray-800'}">
                    <span class="truncate text-sm font-medium">✨ ${chat.title}</span>
                    <button onclick="event.stopPropagation(); deleteChat(${chat.id})" class="opacity-0 group-hover:opacity-100 hover:text-red-500 transition">✕</button>
                </div>
            `).join('');
        }

        function loadChat(id) {
            state.currentChatId = id;
            renderMessages();
            renderHistory();
            if(window.innerWidth < 768) toggleSidebar();
        }

        function deleteChat(id) {
            state.history = state.history.filter(c => c.id !== id);
            if(state.currentChatId === id) state.currentChatId = null;
            localStorage.setItem('ua_history', JSON.stringify(state.history));
            renderHistory();
            renderMessages();
        }

        function renderMessages() {
            const chat = state.history.find(c => c.id === state.currentChatId);
            if (!chat || chat.messages.length === 0) {
                chatDisplay.innerHTML = document.getElementById('welcomeScreen').outerHTML;
                return;
            }

            chatDisplay.innerHTML = chat.messages.map(m => `
                <div class="flex ${m.role === 'user' ? 'justify-end' : 'justify-start'} mb-6">
                    <div class="max-w-[85%] p-5 rounded-[24px] ${m.role === 'user' ? 'bg-[#dde3ea] dark:bg-[#333537] rounded-tr-none' : 'bg-white dark:bg-[#1e1f20] border dark:border-gray-800 rounded-tl-none shadow-sm'}">
                        <div class="prose dark:prose-invert max-w-none text-[15px] leading-relaxed">
                            ${marked.parse(m.content)}
                        </div>
                        ${m.role === 'assistant' ? `
                            <div class="mt-4 flex gap-3 opacity-0 group-hover:opacity-100 transition">
                                <button onclick="speakText(this)" class="text-xs hover:text-blue-500">🔊 Speak</button>
                                <button onclick="copyText(this)" class="text-xs hover:text-blue-500">📋 Copy</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
        }

        // --- Advanced Modules ---
        async function sendMessage() {
            if (state.isStreaming) return;
            const text = userInput.value.trim();
            if (!text || !state.apiKey) return;

            if (!state.currentChatId) {
                state.currentChatId = Date.now();
                state.history.unshift({ id: state.currentChatId, title: text.slice(0, 25), messages: [] });
            }

            const chat = state.history.find(c => c.id === state.currentChatId);
            chat.messages.push({ role: 'user', content: text });
            
            userInput.value = '';
            autoResize(userInput);
            renderMessages();

            // Prepare AI message
            const aiMsg = { role: 'assistant', content: '' };
            chat.messages.push(aiMsg);
            renderMessages();
            const lastBox = chatDisplay.lastElementChild.querySelector('.prose');
            lastBox.classList.add('typing-cursor');

            state.isStreaming = true;
            try {
                const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${state.apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: state.model,
                        messages: [{role: "system", content: state.systemPrompt}, ...chat.messages.slice(0, -1)],
                        stream: true
                    })
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;
                            try {
                                const json = JSON.parse(data);
                                const token = json.choices[0].delta.content || '';
                                aiMsg.content += token;
                                lastBox.innerHTML = marked.parse(aiMsg.content);
                                chatDisplay.scrollTop = chatDisplay.scrollHeight;
                            } catch (e) {}
                        }
                    }
                }
            } catch (err) {
                aiMsg.content = "⚠️ API Connection Error. Check Key and Model settings.";
                renderMessages();
            } finally {
                state.isStreaming = false;
                lastBox.classList.remove('typing-cursor');
                localStorage.setItem('ua_history', JSON.stringify(state.history));
                renderHistory();
            }
        }

        // --- Features ---
        function startSTT() {
            const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!Speech) return alert("Browser does not support Speech Recognition");
            const rec = new Speech();
            rec.onstart = () => micBtn.classList.add('text-red-500', 'animate-pulse');
            rec.onresult = (e) => {
                userInput.value = e.results[0][0].transcript;
                autoResize(userInput);
            };
            rec.onend = () => micBtn.classList.remove('text-red-500', 'animate-pulse');
            rec.start();
        }

        function speakText(btn) {
            const text = btn.closest('.rounded-[24px]').querySelector('.prose').innerText;
            const utter = new SpeechSynthesisUtterance(text);
            speechSynthesis.speak(utter);
        }

        function copyText(btn) {
            const text = btn.closest('.rounded-[24px]').querySelector('.prose').innerText;
            navigator.clipboard.writeText(text);
            btn.innerText = "✅ Copied";
            setTimeout(() => btn.innerText = "📋 Copy", 2000);
        }

        function triggerFile() { document.getElementById('fileInput').click(); }
        
        function clearAllData() {
            if(confirm("Delete all chats and keys?")) {
                localStorage.clear();
                window.location.reload();
            }
        }

        userInput.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
    </script>
</body>
</html>
