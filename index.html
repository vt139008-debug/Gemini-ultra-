<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELITE CANVA ZONE</title>

<style>
:root{
--primary:#2563EB;
--secondary:#7C3AED;
--accent:#06B6D4;
--cta:#FACC15;
--success:#22C55E;
--dark:#020617;
--white:#ffffff;
}

body{
margin:0;
font-family:Arial, sans-serif;
background:var(--dark);
color:white;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:linear-gradient(90deg,var(--primary),var(--secondary));
}

.logo{
font-size:20px;
font-weight:bold;
}

button{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.cta{
background:var(--cta);
color:black;
}

.container{
padding:20px;
}

.product-card{
background:#111827;
padding:15px;
border-radius:12px;
margin-bottom:20px;
}

.product-img{
width:100%;
border-radius:10px;
}

.price{
color:var(--success);
font-size:20px;
font-weight:bold;
}

.buy-btn{
background:var(--primary);
color:white;
width:100%;
margin-top:10px;
}

.hidden{
display:none;
}

.admin-panel{
background:#111827;
padding:20px;
margin-top:20px;
border-radius:12px;
}

input{
padding:8px;
border-radius:6px;
border:none;
margin:5px 0;
width:100%;
}

.footer{
text-align:center;
padding:15px;
background:#111827;
margin-top:20px;
}
</style>
</head>

<body>

<header>
<div class="logo">🚀 ELITE CANVA ZONE</div>
<button class="cta" onclick="showAdmin()">Admin</button>
</header>

<div class="container">

<h2>Featured Product</h2>

<div class="product-card">
<img src="https://via.placeholder.com/400x700" class="product-img">
<h3>Instagram Reel Bundle</h3>
<div class="price">₹499</div>
<button class="buy-btn" onclick="startPayment('Instagram Reel Bundle',499)">Buy Now</button>
</div>

<div id="paymentSection" class="hidden">
<h2>Select Payment Method</h2>

<button onclick="payUPI('gpay')">Google Pay</button>
<button onclick="payUPI('phonepe')">PhonePe</button>
<button onclick="payUPI('paytm')">Paytm</button>
<button onclick="showQR()">Scan QR</button>

<div id="qrSection" class="hidden">
<h3>Scan & Pay</h3>
<img src="https://via.placeholder.com/300" width="200">
</div>
</div>

<div id="adminLogin" class="hidden">
<h2>Admin Login</h2>
<input type="password" id="adminPass" placeholder="Enter Password">
<button onclick="adminAccess()">Login</button>
</div>

<div id="adminPanel" class="hidden admin-panel">
<h2>Admin Dashboard</h2>
<p>Total Orders: <span id="totalOrders">0</span></p>

<h3>Change UPI ID</h3>
<input id="upiInput" placeholder="UPI ID">
<button onclick="saveUPI()">Save</button>

<h3>Orders</h3>
<div id="ordersList"></div>
</div>

</div>

<div class="footer">
© 2026 ELITE CANVA ZONE | All Rights Reserved
</div>

<script>

let currentProduct = "";
let currentAmount = 0;
let upiID = localStorage.getItem("upiID") || "elite.canva.zone@jio";
let orders = JSON.parse(localStorage.getItem("orders")) || [];

document.getElementById("totalOrders").innerText = orders.length;

function startPayment(product, amount){
currentProduct = product;
currentAmount = amount;
document.getElementById("paymentSection").classList.remove("hidden");
}

function generateOrderID(){
return "ORD" + Math.floor(Math.random()*1000000);
}

function payUPI(app){
let orderID = generateOrderID();
let upiLink = `upi://pay?pa=${upiID}&pn=ELITE CANVA ZONE&am=${currentAmount}&cu=INR&tn=${currentProduct}-${orderID}`;

window.location.href = upiLink;

saveOrder(orderID,"Pending");
redirectWhatsApp(orderID);
}

function showQR(){
document.getElementById("qrSection").classList.remove("hidden");
}

function saveOrder(orderID,status){
let order = {
id:orderID,
product:currentProduct,
amount:currentAmount,
status:status
};
orders.push(order);
localStorage.setItem("orders",JSON.stringify(orders));
document.getElementById("totalOrders").innerText = orders.length;
loadOrders();
}

function redirectWhatsApp(orderID){
let msg = `Hi, I have completed the payment
Product: ${currentProduct}
Amount: ₹${currentAmount}
UPI ID: ${upiID}
Order ID: ${orderID}`;

let url = `https://wa.me/917588363851?text=${encodeURIComponent(msg)}`;
setTimeout(()=>{window.location.href=url;},3000);
}

function showAdmin(){
document.getElementById("adminLogin").classList.remove("hidden");
}

function adminAccess(){
let pass = document.getElementById("adminPass").value;
if(pass==="kanha@7890"){
document.getElementById("adminPanel").classList.remove("hidden");
document.getElementById("adminLogin").classList.add("hidden");
loadOrders();
}else{
alert("Wrong Password");
}
}

function saveUPI(){
upiID = document.getElementById("upiInput").value;
localStorage.setItem("upiID",upiID);
alert("UPI Updated");
}

function loadOrders(){
let list = document.getElementById("ordersList");
list.innerHTML="";
orders.forEach(o=>{
list.innerHTML += `
<div style="background:#1f2937;padding:10px;margin:5px 0;border-radius:8px">
Order ID: ${o.id}<br>
Product: ${o.product}<br>
Amount: ₹${o.amount}<br>
Status: ${o.status}
</div>`;
});
}

loadOrders();

</script>

</body>
</html>
