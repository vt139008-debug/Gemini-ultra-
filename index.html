<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Universal AI Chat Interface</title>

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Marked Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
html,body { height:100%; }
.typing-cursor::after { content:"▋"; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity:0; } }
</style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

<div id="loading" class="fixed inset-0 flex items-center justify-center text-lg font-semibold">
Loading App...
</div>

<div id="app" class="hidden min-h-screen flex">

  <!-- Sidebar -->
  <aside id="sidebar"
    class="fixed md:static z-40 inset-y-0 left-0 w-72 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700
           transform -translate-x-full md:translate-x-0 transition-transform duration-200 flex flex-col">

    <div class="p-4 flex items-center justify-between border-b dark:border-gray-700">
      <span class="font-bold">AI Chat</span>
      <button id="closeSidebar" class="md:hidden text-xl">✕</button>
    </div>

    <button id="newChatBtn"
      class="m-3 p-2 rounded-lg bg-gray-900 text-white dark:bg-gray-100 dark:text-gray-900">
      + New Chat
    </button>

    <div id="chatList" class="flex-1 overflow-y-auto"></div>

    <div class="p-3 border-t dark:border-gray-700 space-y-2">
      <button id="settingsBtn" class="w-full p-2 rounded bg-gray-200 dark:bg-gray-700">Settings</button>
      <button id="themeToggle" class="w-full p-2 rounded bg-gray-200 dark:bg-gray-700">Toggle Theme</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col min-h-screen">

    <!-- Top bar -->
    <header class="h-12 flex items-center gap-3 px-3 border-b bg-white dark:bg-gray-800 dark:border-gray-700">
      <button id="openSidebar" class="md:hidden text-xl">☰</button>
      <div id="chatTitle" class="font-semibold truncate">New Chat</div>
    </header>

    <!-- Messages -->
    <main id="messages"
      class="flex-1 overflow-y-auto px-3 py-4 space-y-4 pb-32">
    </main>

    <!-- Input Bar -->
    <div class="fixed bottom-0 left-0 right-0 md:left-72 bg-white dark:bg-gray-800 border-t dark:border-gray-700">
      <div class="max-w-4xl mx-auto p-3">
        <div class="flex gap-2 items-end">
          <textarea id="input"
            rows="1"
            placeholder="Send a message…  (Shift+Enter = new line)"
            class="flex-1 resize-none p-3 rounded-xl border dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:outline-none"></textarea>
          <button id="sendBtn"
            class="px-4 py-3 rounded-xl bg-gray-900 text-white dark:bg-gray-100 dark:text-gray-900">
            Send
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="hidden fixed inset-0 bg-black/40 z-50 items-center justify-center">
  <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-xl p-5 space-y-4">
    <h2 class="text-lg font-bold">Settings</h2>

    <div>
      <label class="text-sm">OpenRouter API Key</label>
      <input id="apiKeyInput" type="password"
        class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600"/>
    </div>

    <div>
      <label class="text-sm">Model</label>
      <input id="modelInput" type="text"
        class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600"
        placeholder="tngtech/deepseek-r1t2-chimera:free"/>
    </div>

    <div>
      <label class="text-sm">Global System Prompt</label>
      <textarea id="systemPromptInput"
        class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600"></textarea>
    </div>

    <div class="flex justify-end gap-2">
      <button id="closeSettings" class="px-3 py-2 bg-gray-200 dark:bg-gray-700 rounded">Close</button>
      <button id="saveSettings" class="px-3 py-2 bg-gray-900 text-white dark:bg-gray-100 dark:text-gray-900 rounded">Save</button>
    </div>
  </div>
</div>

<script>
/* =========================
   SAFE INIT WRAPPER
========================= */
(function(){

const $ = id => document.getElementById(id);

/* ---------- State ---------- */
let chats = JSON.parse(localStorage.getItem("uaichats") || "[]");
let currentChatId = localStorage.getItem("uaicurrent") || null;
let apiKey = localStorage.getItem("uai_apikey") || "";
let model = localStorage.getItem("uai_model") || "tngtech/deepseek-r1t2-chimera:free";
let globalSystemPrompt = localStorage.getItem("uai_system") || "";
let dark = localStorage.getItem("uai_dark") === "1";

/* ---------- Theme ---------- */
if(dark) document.documentElement.classList.add("dark");

/* ---------- Helpers ---------- */
function saveAll(){
  localStorage.setItem("uaichats", JSON.stringify(chats));
  localStorage.setItem("uaicurrent", currentChatId || "");
}

function uid(){
  return "c"+Math.random().toString(36).slice(2);
}

function getCurrentChat(){
  return chats.find(c=>c.id===currentChatId);
}

function ensureChat(){
  if(!currentChatId || !getCurrentChat()){
    const c = {id:uid(), title:"New Chat", messages:[], system:""};
    chats.unshift(c);
    currentChatId = c.id;
    saveAll();
  }
}

/* ---------- Sidebar ---------- */
function renderChatList(){
  $("chatList").innerHTML = "";
  chats.forEach(c=>{
    const div = document.createElement("div");
    div.className = "p-3 hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer group";
    if(c.id===currentChatId) div.className += " bg-gray-200 dark:bg-gray-700";

    const row = document.createElement("div");
    row.className="flex justify-between items-center gap-2";

    const title = document.createElement("div");
    title.className="truncate flex-1";
    title.textContent = c.title || "Untitled";
    title.onclick=()=>{ currentChatId=c.id; saveAll(); refresh(); closeSidebar(); };

    const menu = document.createElement("div");
    menu.className="hidden group-hover:flex gap-1";

    const ren = document.createElement("button");
    ren.textContent="✎";
    ren.onclick=(e)=>{
      e.stopPropagation();
      const t = prompt("Rename chat", c.title);
      if(t){ c.title=t; saveAll(); renderChatList(); renderTitle(); }
    };

    const del = document.createElement("button");
    del.textContent="🗑";
    del.onclick=(e)=>{
      e.stopPropagation();
      if(confirm("Delete chat?")){
        chats = chats.filter(x=>x.id!==c.id);
        if(currentChatId===c.id) currentChatId=null;
        ensureChat(); saveAll(); refresh();
      }
    };

    menu.appendChild(ren);
    menu.appendChild(del);
    row.appendChild(title);
    row.appendChild(menu);
    div.appendChild(row);
    $("chatList").appendChild(div);
  });
}

function renderTitle(){
  const c=getCurrentChat();
  $("chatTitle").textContent = c?.title || "Chat";
}

/* ---------- Messages ---------- */
function renderMessages(){
  const box = $("messages");
  box.innerHTML="";
  const c=getCurrentChat();
  if(!c) return;

  c.messages.forEach(m=>{
    box.appendChild(renderMessageNode(m));
  });
  box.scrollTop = box.scrollHeight;
}

function renderMessageNode(m){
  const wrap = document.createElement("div");
  wrap.className = "flex " + (m.role==="user"?"justify-end":"justify-start");

  const bubble = document.createElement("div");
  bubble.className = "max-w-[90%] md:max-w-2xl p-3 rounded-xl border dark:border-gray-700 " +
    (m.role==="user"
      ? "bg-gray-900 text-white dark:bg-gray-100 dark:text-gray-900"
      : "bg-white dark:bg-gray-800");

  if(m.role==="assistant"){
    bubble.innerHTML = marked.parse(m.content || "");
  } else {
    bubble.textContent = m.content || "";
  }

  wrap.appendChild(bubble);
  return wrap;
}

/* ---------- Input Auto Grow ---------- */
$("input").addEventListener("input", e=>{
  e.target.style.height="auto";
  e.target.style.height = Math.min(e.target.scrollHeight,200)+"px";
});

/* ---------- New Chat ---------- */
$("newChatBtn").onclick=()=>{
  const c={id:uid(), title:"New Chat", messages:[], system:""};
  chats.unshift(c);
  currentChatId=c.id;
  saveAll();
  refresh();
  closeSidebar();
};

/* ---------- Send ---------- */
$("sendBtn").onclick=send;
$("input").addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    send();
  }
});

async function send(){
  const text = $("input").value.trim();
  if(!text) return;
  ensureChat();
  const c=getCurrentChat();

  c.messages.push({role:"user", content:text});
  if(c.title==="New Chat") c.title=text.slice(0,40);
  $("input").value="";
  $("input").style.height="auto";
  saveAll();
  refresh();

  // Hidden multimodal command router
  if(await handleSpecialCommands(text)) return;

  await streamAIResponse();
}

/* ---------- Special Commands (hidden features) ---------- */
async function handleSpecialCommands(text){
  const lower=text.toLowerCase();

  function addAI(msg){
    const c=getCurrentChat();
    c.messages.push({role:"assistant", content:msg});
    saveAll(); renderMessages();
  }

  if(lower.startsWith("/image ")){
    const p=text.slice(7);
    addAI("🖼️ Image generation requested:\n\n`"+p+"`\n\n(Connect your image API here)");
    return true;
  }
  if(lower.startsWith("/video ")){
    addAI("🎬 Text-to-Video queued (stub).");
    return true;
  }
  if(lower.startsWith("/tts ")){
    addAI("🔊 Text-to-Speech ready (stub).");
    return true;
  }
  if(lower.startsWith("/stt ")){
    addAI("🎙️ Voice-to-Text ready (stub).");
    return true;
  }
  if(lower.startsWith("/music ")){
    addAI("🎵 Music generation ready (stub).");
    return true;
  }
  if(lower.startsWith("/avatar ")){
    addAI("🧍 AI Avatar video ready (stub).");
    return true;
  }
  return false;
}

/* ---------- Streaming OpenRouter ---------- */
async function streamAIResponse(){
  if(!apiKey){
    alert("Set OpenRouter API key in Settings");
    return;
  }

  const c=getCurrentChat();
  const sys = c.system || globalSystemPrompt;

  const msgs=[];
  if(sys) msgs.push({role:"system", content:sys});
  c.messages.forEach(m=>msgs.push({role:m.role, content:m.content}));

  const aiMsg = {role:"assistant", content:""};
  c.messages.push(aiMsg);
  renderMessages();

  const container = $("messages").lastChild.querySelector("div");
  container.classList.add("typing-cursor");

  try{
    const res = await fetch("https://openrouter.ai/api/v1/chat/completions",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+apiKey,
        "HTTP-Referer": location.href,
        "X-Title":"Universal AI Chat"
      },
      body: JSON.stringify({
        model:model,
        messages:msgs,
        stream:true
      })
    });

    if(!res.body) throw new Error("No stream");

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf="";

    while(true){
      const {done,value} = await reader.read();
      if(done) break;
      buf += decoder.decode(value,{stream:true});
      const lines = buf.split("\n");
      buf = lines.pop();

      for(const line of lines){
        if(!line.startsWith("data:")) continue;
        const data=line.slice(5).trim();
        if(data==="[DONE]") break;
        try{
          const json=JSON.parse(data);
          const token = json.choices?.[0]?.delta?.content;
          if(token){
            aiMsg.content += token;
            container.innerHTML = marked.parse(aiMsg.content);
            $("messages").scrollTop = $("messages").scrollHeight;
          }
        }catch{}
      }
    }

  }catch(err){
    aiMsg.content += "\n\n❌ Error: "+err.message;
  }

  container.classList.remove("typing-cursor");
  saveAll();
  renderMessages();
}

/* ---------- Settings ---------- */
$("settingsBtn").onclick=()=>{
  $("settingsModal").classList.remove("hidden");
  $("settingsModal").classList.add("flex");
  $("apiKeyInput").value=apiKey;
  $("modelInput").value=model;
  $("systemPromptInput").value=globalSystemPrompt;
};

$("closeSettings").onclick=()=>hideSettings();

function hideSettings(){
  $("settingsModal").classList.add("hidden");
  $("settingsModal").classList.remove("flex");
}

$("saveSettings").onclick=()=>{
  apiKey=$("apiKeyInput").value.trim();
  model=$("modelInput").value.trim() || model;
  globalSystemPrompt=$("systemPromptInput").value;

  localStorage.setItem("uai_apikey", apiKey);
  localStorage.setItem("uai_model", model);
  localStorage.setItem("uai_system", globalSystemPrompt);
  hideSettings();
};

/* ---------- Theme Toggle ---------- */
$("themeToggle").onclick=()=>{
  dark=!dark;
  document.documentElement.classList.toggle("dark", dark);
  localStorage.setItem("uai_dark", dark?"1":"0");
};

/* ---------- Sidebar Mobile ---------- */
function openSidebar(){ $("sidebar").classList.remove("-translate-x-full"); }
function closeSidebar(){ if(window.innerWidth<768) $("sidebar").classList.add("-translate-x-full"); }
$("openSidebar").onclick=openSidebar;
$("closeSidebar").onclick=closeSidebar;

/* ---------- Refresh ---------- */
function refresh(){
  ensureChat();
  renderChatList();
  renderTitle();
  renderMessages();
}

/* ---------- Boot ---------- */
ensureChat();
refresh();
$("loading").style.display="none";
$("app").classList.remove("hidden");

})();
</script>

</body>
</html>
