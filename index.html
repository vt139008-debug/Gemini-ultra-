<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal AI - Production Grade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --gemini-blue: #1a73e8; }
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        #loading { position: fixed; inset: 0; display: flex; flex-direction: column; items: center; justify-content: center; background: white; z-index: 9999; }
        .dark #loading { background: #131314; color: white; }
        .sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @media (max-width: 768px) { .sidebar { position: fixed; height: 100%; transform: translateX(-100%); z-index: 100; } .sidebar.open { transform: translateX(0); } }
        .prose pre { background: #1e1e20 !important; color: #e0e0e0; padding: 1rem; border-radius: 12px; overflow-x: auto; border: 1px solid #333; margin: 10px 0; }
        .prose code { color: #f2a1ff; font-family: monospace; }
        .message-bubble { animation: messageIn 0.3s ease-out forwards; }
        @keyframes messageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        textarea { scrollbar-width: none; }
        .typing-dot { width: 4px; height: 4px; background: currentColor; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
    </style>
</head>
<body class="bg-[#f8fafd] dark:bg-[#131314] text-gray-900 dark:text-gray-100 transition-colors duration-200">

    <div id="loading">
        <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 font-medium opacity-70">Initializing Interface...</p>
    </div>

    <div id="app" class="hidden flex h-full w-full overflow-hidden">
        <div id="overlay" class="fixed inset-0 bg-black/50 hidden z-[90]" onclick="toggleSidebar()"></div>

        <aside id="sidebar" class="sidebar w-72 bg-[#f0f4f9] dark:bg-[#1e1f20] p-4 flex flex-col shrink-0 border-r dark:border-gray-800">
            <button onclick="createNewChat()" class="mb-4 flex items-center justify-center gap-2 bg-[#dde3ea] dark:bg-[#333537] hover:brightness-95 p-4 rounded-2xl w-full font-bold shadow-sm transition-all">
                <span class="text-xl">+</span> New Chat
            </button>
            <div id="chatHistory" class="flex-1 overflow-y-auto space-y-2 no-scrollbar"></div>
            <div class="mt-4 pt-4 border-t border-gray-300 dark:border-gray-700 space-y-1">
                <button onclick="openSettings()" class="w-full text-left p-3 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-xl transition">⚙️ Settings</button>
                <button onclick="toggleDarkMode()" class="w-full text-left p-3 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-xl transition">🌗 Dark Theme</button>
                <button onclick="clearStorage()" class="w-full text-left p-3 hover:bg-red-50 dark:hover:bg-red-900/20 text-red-500 rounded-xl transition text-xs">🗑️ Reset App</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col min-w-0 bg-white dark:bg-[#131314] relative h-full">
            <header class="h-14 flex items-center justify-between px-4 border-b dark:border-gray-800 md:hidden shrink-0">
                <button onclick="toggleSidebar()" class="p-2">☰</button>
                <span class="font-bold text-blue-600">Gemini Pro</span>
                <div class="w-8"></div>
            </header>

            <div id="chatDisplay" class="flex-1 overflow-y-auto p-4 md:px-12 lg:px-24 xl:px-48 space-y-6">
                <div id="welcome" class="h-full flex flex-col items-center justify-center text-center py-20">
                    <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-blue-500 to-purple-600 bg-clip-text text-transparent mb-4">Hello, Friend.</h1>
                    <p class="text-gray-500 dark:text-gray-400 max-w-md">Your universal AI interface is ready. Start by entering a prompt or uploading an image.</p>
                </div>
            </div>

            <div class="p-4 bg-gradient-to-t from-white dark:from-[#131314] via-white dark:via-[#131314] to-transparent shrink-0">
                <div class="max-w-4xl mx-auto">
                    <div id="imgPreview" class="hidden flex p-2 mb-3 bg-gray-100 dark:bg-gray-800 rounded-2xl w-fit relative border dark:border-gray-700">
                        <img id="previewItem" class="h-20 w-20 object-cover rounded-xl shadow-md">
                        <button onclick="removeImage()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center shadow-lg">✕</button>
                    </div>

                    <div class="relative bg-[#f0f4f9] dark:bg-[#1e1f20] rounded-[30px] shadow-sm focus-within:shadow-md border border-transparent focus-within:border-blue-500/50 transition-all p-2">
                        <textarea id="userInput" rows="1" placeholder="Type your prompt..." class="w-full bg-transparent border-none focus:ring-0 p-4 text-base md:text-lg resize-none max-h-48 overflow-y-auto" oninput="autoResize(this)"></textarea>
                        
                        <div class="flex items-center justify-between px-2 pb-1">
                            <div class="flex gap-1">
                                <button onclick="triggerFile()" class="p-3 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-full transition" title="Add Image">🖼️</button>
                                <button onclick="startVoice()" id="micBtn" class="p-3 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-full transition" title="Voice Input">🎙️</button>
                                <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="handleFile(this)">
                            </div>
                            <button id="sendBtn" onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white w-12 h-12 rounded-full flex items-center justify-center transition-all shadow-md active:scale-95">
                                <svg class="w-5 h-5 rotate-90" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
                            </button>
                        </div>
                    </div>
                    <p class="text-[10px] text-center mt-3 opacity-40 uppercase tracking-widest font-bold">Secure Local Environment</p>
                </div>
            </div>
        </main>
    </div>

    <div id="settingsModal" class="fixed inset-0 bg-black/60 hidden z-[200] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white dark:bg-[#1e1f20] p-8 rounded-[32px] w-full max-w-md shadow-2xl border dark:border-gray-800">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">AI Config</h2>
                <button onclick="closeSettings()" class="text-xl">✕</button>
            </div>
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-bold mb-2 opacity-50 uppercase">OpenRouter Key</label>
                    <input type="password" id="apiKey" class="w-full p-4 rounded-2xl bg-gray-100 dark:bg-gray-800 border-none outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-2 opacity-50 uppercase">Model Selection</label>
                    <input type="text" id="modelName" class="w-full p-4 rounded-2xl bg-gray-100 dark:bg-gray-800 border-none outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <button onclick="saveSettings()" class="w-full mt-8 p-4 bg-blue-600 text-white rounded-2xl font-bold shadow-lg shadow-blue-500/20 active:scale-95 transition">Apply Changes</button>
        </div>
    </div>

    <script>
        // --- Architecture State ---
        const config = {
            key: localStorage.getItem('v3_key') || '',
            model: localStorage.getItem('v3_model') || 'google/gemini-pro-1.5-exp:free',
            history: JSON.parse(localStorage.getItem('v3_history')) || [],
            theme: localStorage.getItem('v3_theme') || 'dark',
            currentChatId: null,
            isStreaming: false,
            pendingImage: null
        };

        const elements = {
            chat: document.getElementById('chatDisplay'),
            input: document.getElementById('userInput'),
            history: document.getElementById('chatHistory'),
            mic: document.getElementById('micBtn'),
            sidebar: document.getElementById('sidebar'),
            overlay: document.getElementById('overlay')
        };

        // --- Init ---
        window.addEventListener('DOMContentLoaded', () => {
            if (config.theme === 'dark') document.documentElement.classList.add('dark');
            document.getElementById('apiKey').value = config.key;
            document.getElementById('modelName').value = config.model;
            renderHistory();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('app').classList.remove('hidden');
        });

        // --- Functions ---
        function toggleSidebar() { 
            elements.sidebar.classList.toggle('open'); 
            elements.overlay.classList.toggle('hidden');
        }

        function toggleDarkMode() {
            config.theme = document.documentElement.classList.toggle('dark') ? 'dark' : 'light';
            localStorage.setItem('v3_theme', config.theme);
        }

        function openSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }
        
        function saveSettings() {
            config.key = document.getElementById('apiKey').value.trim();
            config.model = document.getElementById('modelName').value.trim();
            localStorage.setItem('v3_key', config.key);
            localStorage.setItem('v3_model', config.model);
            closeSettings();
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 192) + 'px';
        }

        // --- File Handling ---
        function triggerFile() { document.getElementById('fileInput').click(); }
        function handleFile(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                config.pendingImage = e.target.result;
                document.getElementById('previewItem').src = e.target.result;
                document.getElementById('imgPreview').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }
        function removeImage() {
            config.pendingImage = null;
            document.getElementById('imgPreview').classList.add('hidden');
            document.getElementById('fileInput').value = '';
        }

        // --- Chat logic ---
        function createNewChat() {
            config.currentChatId = Date.now();
            config.history.unshift({ id: config.currentChatId, title: 'New Conversation', messages: [] });
            if (window.innerWidth < 768) toggleSidebar();
            renderHistory();
            renderMessages();
        }

        function loadChat(id) {
            config.currentChatId = id;
            if (window.innerWidth < 768) toggleSidebar();
            renderHistory();
            renderMessages();
        }

        function renderHistory() {
            elements.history.innerHTML = config.history.map(c => `
                <div onclick="loadChat(${c.id})" class="p-3 rounded-xl cursor-pointer truncate text-sm transition-all ${config.currentChatId === c.id ? 'bg-[#dde3ea] dark:bg-[#333537] font-bold' : 'hover:bg-gray-200 dark:hover:bg-gray-800 opacity-70'}">
                    💬 ${c.title}
                </div>
            `).join('');
        }

        function renderMessages() {
            const chat = config.history.find(c => c.id === config.currentChatId);
            if (!chat || chat.messages.length === 0) {
                elements.chat.innerHTML = document.getElementById('welcome').outerHTML;
                return;
            }

            elements.chat.innerHTML = chat.messages.map(m => `
                <div class="flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}">
                    <div class="message-bubble p-4 md:p-5 rounded-[24px] ${m.role === 'user' ? 'bg-[#dde3ea] dark:bg-[#333537] rounded-tr-none' : 'bg-white dark:bg-[#1e1f20] border dark:border-gray-800 rounded-tl-none shadow-sm'} max-w-[90%] md:max-w-[80%]">
                        ${m.img ? `<img src="${m.img}" class="max-w-full h-auto rounded-lg mb-4 border dark:border-gray-700 shadow-sm">` : ''}
                        <div class="prose dark:prose-invert max-w-none text-[15px] leading-relaxed">
                            ${marked.parse(m.content, { breaks: true })}
                        </div>
                    </div>
                </div>
            `).join('');
            elements.chat.scrollTo({ top: elements.chat.scrollHeight, behavior: 'smooth' });
        }

        async function sendMessage() {
            const text = elements.input.value.trim();
            if ((!text && !config.pendingImage) || config.isStreaming) return;
            if (!config.key) return openSettings();

            if (!config.currentChatId) {
                config.currentChatId = Date.now();
                config.history.unshift({ id: config.currentChatId, title: text.slice(0, 30) || 'Image Query', messages: [] });
            }

            const chat = config.history.find(c => c.id === config.currentChatId);
            const userMsg = { role: 'user', content: text, img: config.pendingImage };
            chat.messages.push(userMsg);
            
            // UI Update
            elements.input.value = '';
            autoResize(elements.input);
            removeImage();
            renderMessages();

            // Prepare Assistant
            const aiMsg = { role: 'assistant', content: '' };
            chat.messages.push(aiMsg);
            renderMessages();
            const lastMessageEl = elements.chat.lastElementChild.querySelector('.prose');
            lastMessageEl.innerHTML = '<div class="flex gap-1"><div class="typing-dot"></div><div class="typing-dot" style="animation-delay:0.2s"></div><div class="typing-dot" style="animation-delay:0.4s"></div></div>';
            
            config.isStreaming = true;

            try {
                const payload = {
                    model: config.model,
                    stream: true,
                    messages: chat.messages.slice(0, -1).map(m => {
                        if (m.img) {
                            return {
                                role: m.role,
                                content: [
                                    { type: "text", text: m.content || "Analyze this image" },
                                    { type: "image_url", image_url: { url: m.img } }
                                ]
                            };
                        }
                        return { role: m.role, content: m.content };
                    })
                };

                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${config.key}`, 
                        "Content-Type": "application/json",
                        "HTTP-Referer": window.location.origin,
                        "X-Title": "Universal AI Clone"
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("API Limit reached or Invalid Key");

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");
                    buffer = lines.pop(); // Keep partial line in buffer

                    for (const line of lines) {
                        const cleanLine = line.replace(/^data: /, "").trim();
                        if (!cleanLine || cleanLine === "[DONE]") continue;

                        try {
                            const json = JSON.parse(cleanLine);
                            const token = json.choices[0].delta.content || "";
                            aiMsg.content += token;
                            lastMessageEl.innerHTML = marked.parse(aiMsg.content);
                            elements.chat.scrollTop = elements.chat.scrollHeight;
                        } catch (e) { /* Ignore partial JSON chunks */ }
                    }
                }
            } catch (err) {
                aiMsg.content = `⚠️ **Error**: ${err.message}`;
                lastMessageEl.innerHTML = marked.parse(aiMsg.content);
            } finally {
                config.isStreaming = false;
                localStorage.setItem('v3_history', JSON.stringify(config.history));
                renderHistory();
            }
        }

        // --- Voice Interaction ---
        function startVoice() {
            const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!Recognition) return alert("Browser not supported");
            const rec = new Recognition();
            rec.onstart = () => elements.mic.classList.add('text-red-500', 'scale-110');
            rec.onresult = (e) => { elements.input.value = e.results[0][0].transcript; autoResize(elements.input); };
            rec.onend = () => elements.mic.classList.remove('text-red-500', 'scale-110');
            rec.start();
        }

        function clearStorage() {
            if (confirm("Clear all conversations and keys?")) {
                localStorage.clear();
                window.location.reload();
            }
        }

        // --- Event Listeners ---
        elements.input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 768) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
