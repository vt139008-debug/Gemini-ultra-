<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Universal AI Chat Interface</title>

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Marked.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
tailwind.config = {
  darkMode: 'class'
}
</script>

<style>
/* markdown styling */
.prose pre {
  background:#0f172a;
  color:#e5e7eb;
  padding:12px;
  border-radius:12px;
  overflow:auto;
}
.prose code {
  background:#e5e7eb;
  padding:2px 6px;
  border-radius:6px;
}
.dark .prose code {
  background:#1f2937;
}
</style>
</head>

<body class="bg-gray-50 dark:bg-gray-900">

<!-- Loader fallback -->
<div id="loading" class="fixed inset-0 flex items-center justify-center text-lg font-semibold">
Loading App...
</div>

<div id="app" class="hidden min-h-screen flex">

  <!-- Sidebar -->
  <aside id="sidebar"
    class="w-72 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col fixed md:static inset-y-0 left-0 z-40 transform -translate-x-full md:translate-x-0 transition">
    
    <div class="p-4 flex justify-between items-center border-b dark:border-gray-700">
      <div class="font-bold">AI Chat</div>
      <button id="closeSidebar" class="md:hidden">✕</button>
    </div>

    <div class="p-3">
      <button id="newChatBtn" class="w-full bg-black text-white dark:bg-white dark:text-black rounded-xl py-2">
        + New Chat
      </button>
    </div>

    <div id="chatList" class="flex-1 overflow-y-auto p-2 space-y-2"></div>

    <div class="p-3 border-t dark:border-gray-700 space-y-2">
      <button id="settingsBtn" class="w-full border rounded-xl py-2">Settings</button>
      <button id="darkToggle" class="w-full border rounded-xl py-2">Toggle Dark</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 flex flex-col min-h-screen md:ml-72">

    <!-- Top bar -->
    <div class="h-14 flex items-center gap-3 px-4 border-b bg-white dark:bg-gray-800 dark:border-gray-700">
      <button id="openSidebar" class="md:hidden text-xl">☰</button>
      <div id="chatTitle" class="font-semibold truncate">New Chat</div>
    </div>

    <!-- Messages -->
    <div id="messages"
      class="flex-1 overflow-y-auto px-3 py-4 space-y-4 pb-40">
    </div>

    <!-- Tool bar -->
    <div class="px-3 py-2 border-t dark:border-gray-700 bg-gray-50 dark:bg-gray-800 overflow-x-auto">
      <div class="flex gap-2 text-xs">
        <button class="toolBtn border px-3 py-1 rounded-full">Text→Image</button>
        <button class="toolBtn border px-3 py-1 rounded-full">Text→Video</button>
        <button class="toolBtn border px-3 py-1 rounded-full">Text→Voice</button>
        <button class="toolBtn border px-3 py-1 rounded-full">Image→Image</button>
        <button class="toolBtn border px-3 py-1 rounded-full">Video→Text</button>
        <button class="toolBtn border px-3 py-1 rounded-full">Voice→Text</button>
        <button class="toolBtn border px-3 py-1 rounded-full">Text→Music</button>
        <button class="toolBtn border px-3 py-1 rounded-full">AI Avatar</button>
        <button class="toolBtn border px-3 py-1 rounded-full">Ad Creator</button>
        <button class="toolBtn border px-3 py-1 rounded-full">Code/App AI</button>
      </div>
    </div>

    <!-- Input -->
    <div class="fixed bottom-0 left-0 right-0 md:left-72 bg-white dark:bg-gray-800 border-t dark:border-gray-700 p-3 pb-[env(safe-area-inset-bottom)]">
      <div class="flex gap-2">
        <textarea id="input"
          rows="1"
          class="flex-1 resize-none border rounded-xl p-3 max-h-40 overflow-y-auto bg-transparent"
          placeholder="Type your message..."></textarea>
        <button id="sendBtn"
          class="px-5 rounded-xl bg-black text-white dark:bg-white dark:text-black">
          Send
        </button>
      </div>
    </div>

  </main>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
  <div class="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-md p-5 space-y-4">
    <div class="text-lg font-bold">Settings</div>

    <div>
      <label class="text-sm">OpenRouter API Key</label>
      <input id="apiKeyInput" type="password" class="w-full border rounded-lg p-2 bg-transparent"/>
    </div>

    <div>
      <label class="text-sm">Model</label>
      <input id="modelInput" class="w-full border rounded-lg p-2 bg-transparent"
        value="deepseek/deepseek-r1:free"/>
    </div>

    <div>
      <label class="text-sm">System Prompt</label>
      <textarea id="systemPromptInput" class="w-full border rounded-lg p-2 h-24 bg-transparent"></textarea>
    </div>

    <div class="flex gap-2">
      <button id="saveSettings" class="flex-1 bg-black text-white dark:bg-white dark:text-black rounded-xl py-2">Save</button>
      <button id="closeSettings" class="flex-1 border rounded-xl py-2">Close</button>
    </div>
  </div>
</div>

<script>
/* =========================
   SAFE INIT WRAPPER
========================= */
(function(){

/* ---------- DOM ---------- */
const loading = document.getElementById("loading");
const app = document.getElementById("app");
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");

/* ---------- STATE ---------- */
let chats = JSON.parse(localStorage.getItem("ua_chats")||"[]");
let activeId = localStorage.getItem("ua_active") || null;

if(!chats.length){
  createChat();
}

/* ---------- DARK MODE ---------- */
if(localStorage.getItem("ua_dark")==="1"){
  document.documentElement.classList.add("dark");
}

document.getElementById("darkToggle").onclick = ()=>{
  document.documentElement.classList.toggle("dark");
  localStorage.setItem("ua_dark",
    document.documentElement.classList.contains("dark")?"1":"0");
};

/* ---------- SIDEBAR ---------- */
const sidebar = document.getElementById("sidebar");
document.getElementById("openSidebar").onclick=()=> sidebar.classList.remove("-translate-x-full");
document.getElementById("closeSidebar").onclick=()=> sidebar.classList.add("-translate-x-full");

/* ---------- SETTINGS ---------- */
const modal = document.getElementById("settingsModal");
document.getElementById("settingsBtn").onclick=()=>{
  modal.classList.remove("hidden");
  apiKeyInput.value = localStorage.getItem("ua_key")||"";
  modelInput.value = localStorage.getItem("ua_model")||"deepseek/deepseek-r1:free";
  systemPromptInput.value = getActive().systemPrompt||"";
};
closeSettings.onclick=()=>modal.classList.add("hidden");

saveSettings.onclick=()=>{
  localStorage.setItem("ua_key", apiKeyInput.value.trim());
  localStorage.setItem("ua_model", modelInput.value.trim());
  getActive().systemPrompt = systemPromptInput.value;
  persist();
  modal.classList.add("hidden");
};

/* ---------- CHAT CRUD ---------- */
function createChat(){
  const id = "c_"+Date.now();
  chats.unshift({id,title:"New Chat",messages:[],systemPrompt:""});
  activeId=id;
  persist();
}

function getActive(){
  return chats.find(c=>c.id===activeId);
}

function persist(){
  localStorage.setItem("ua_chats", JSON.stringify(chats));
  localStorage.setItem("ua_active", activeId);
  renderList();
}

/* ---------- RENDER SIDEBAR ---------- */
function renderList(){
  const list = document.getElementById("chatList");
  list.innerHTML="";
  chats.forEach(c=>{
    const d=document.createElement("div");
    d.className="group border rounded-xl p-2 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700";
    d.innerHTML=`
      <div class="flex justify-between items-center gap-2">
        <div class="truncate">${c.title}</div>
        <div class="hidden group-hover:flex gap-1">
          <button data-r="${c.id}">✎</button>
          <button data-d="${c.id}">🗑</button>
        </div>
      </div>`;
    d.onclick=()=>{activeId=c.id; loadChat(); sidebar.classList.add("-translate-x-full");};
    list.appendChild(d);
  });
}

document.getElementById("chatList").onclick=(e)=>{
  if(e.target.dataset.d){
    chats=chats.filter(x=>x.id!==e.target.dataset.d);
    if(activeId===e.target.dataset.d) createChat();
    persist(); loadChat();
  }
  if(e.target.dataset.r){
    const c=chats.find(x=>x.id===e.target.dataset.r);
    const t=prompt("Rename chat", c.title);
    if(t){ c.title=t; persist(); loadChat(); }
  }
};

document.getElementById("newChatBtn").onclick=()=>{createChat(); loadChat();};

/* ---------- LOAD CHAT ---------- */
function loadChat(){
  const c=getActive();
  if(!c) return;
  document.getElementById("chatTitle").textContent=c.title;
  messagesEl.innerHTML="";
  c.messages.forEach(m=>addMsg(m.role,m.content,false));
  scrollBottom();
}
renderList();
loadChat();

/* ---------- MESSAGE RENDER ---------- */
function addMsg(role, text, save=true){
  if(!text && text!=="") return;

  const wrap=document.createElement("div");
  wrap.className = role==="user" ? "flex justify-end" : "flex justify-start";

  const bubble=document.createElement("div");
  bubble.className="max-w-[90%] md:max-w-2xl rounded-2xl p-3 border bg-white dark:bg-gray-800 prose dark:prose-invert";
  if(role==="user"){
    bubble.classList.add("bg-gray-200","dark:bg-gray-700");
    bubble.textContent=text;
  }else{
    bubble.innerHTML = marked.parse(text);
  }

  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);

  if(save){
    getActive().messages.push({role,content:text});
    persist();
  }
}

/* ---------- INPUT AUTO SIZE ---------- */
inputEl.addEventListener("input",()=>{
  inputEl.style.height="auto";
  inputEl.style.height=inputEl.scrollHeight+"px";
});

/* ---------- SEND ---------- */
document.getElementById("sendBtn").onclick=send;
inputEl.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault(); send();
  }
});

async function send(){
  const text=inputEl.value.trim();
  if(!text) return;
  inputEl.value=""; inputEl.style.height="auto";

  addMsg("user",text,true);
  if(getActive().messages.length===1){
    getActive().title=text.slice(0,30);
  }
  scrollBottom();

  const apiKey = localStorage.getItem("ua_key");
  if(!apiKey){
    alert("Set API key in Settings");
    return;
  }

  const model = localStorage.getItem("ua_model") || "deepseek/deepseek-r1:free";

  const aiWrap=document.createElement("div");
  aiWrap.className="flex justify-start";
  const aiBubble=document.createElement("div");
  aiBubble.className="max-w-[90%] md:max-w-2xl rounded-2xl p-3 border bg-white dark:bg-gray-800 prose dark:prose-invert";
  aiWrap.appendChild(aiBubble);
  messagesEl.appendChild(aiWrap);

  try{
    const msgs=[];
    const sys=getActive().systemPrompt;
    if(sys) msgs.push({role:"system",content:sys});
    getActive().messages.forEach(m=>msgs.push(m));
    msgs.push({role:"user",content:text});

    const res = await fetch("https://openrouter.ai/api/v1/chat/completions",{
      method:"POST",
      headers:{
        "Authorization":"Bearer "+apiKey,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        model,
        messages:msgs,
        stream:true
      })
    });

    if(!res.body) throw new Error("No stream");

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let full="";

    while(true){
      const {value,done}=await reader.read();
      if(done) break;
      const chunk=dec.decode(value);
      chunk.split("\n").forEach(line=>{
        if(line.startsWith("data: ")){
          const d=line.slice(6);
          if(d==="[DONE]") return;
          try{
            const j=JSON.parse(d);
            const tok=j.choices?.[0]?.delta?.content;
            if(tok){
              full+=tok;
              aiBubble.innerHTML = marked.parse(full);
              scrollBottom();
            }
          }catch{}
        }
      });
    }

    getActive().messages.push({role:"assistant",content:full});
    persist();

  }catch(err){
    aiBubble.textContent="Error: "+err.message;
  }
}

/* ---------- SCROLL ---------- */
function scrollBottom(){
  setTimeout(()=>messagesEl.scrollTop=messagesEl.scrollHeight,50);
}

/* ---------- TOOL BUTTONS ---------- */
document.querySelectorAll(".toolBtn").forEach(b=>{
  b.onclick=()=>{
    inputEl.value = `[${b.textContent}] `;
    inputEl.focus();
  };
});

/* ---------- TTS (Text→Voice) ---------- */
window.speakText = function(t){
  if(!("speechSynthesis" in window)) return alert("TTS not supported");
  const u=new SpeechSynthesisUtterance(t);
  speechSynthesis.speak(u);
};

/* ---------- STT (Voice→Text) ---------- */
window.voiceToText = function(){
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return alert("STT not supported");
  const r=new SR();
  r.onresult=e=> inputEl.value += " "+ e.results[0][0].transcript;
  r.start();
};

/* ---------- FINAL INIT ---------- */
loading.style.display="none";
app.classList.remove("hidden");

})(); // end safe init
</script>

</body>
</html>
