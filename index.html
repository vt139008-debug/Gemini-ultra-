<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Workspace Pro</title>
    
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        /* Speed Optimization: Hide app until CSS/JS ready */
        [v-cloak] { display: none; }
        
        :root { --sidebar-w: 280px; }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        /* Smooth Scroll & Transitions */
        .chat-scroll { scroll-behavior: smooth; scrollbar-gutter: stable; }
        .transition-all { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Gemini Style Glassmorphism */
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .dark .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); }

        /* Typing Indicator Animation */
        .typing-dot { animation: typing 1.4s infinite; }
        @keyframes typing { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

        /* Markdown Styles */
        .prose pre { background: #1e293b; color: #e2e8f0; padding: 1rem; border-radius: 0.75rem; overflow-x: auto; }
        .prose code { font-size: 0.9em; background: rgba(0,0,0,0.05); padding: 0.2rem 0.4rem; border-radius: 0.25rem; }
        .dark .prose code { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 h-full overflow-hidden">

    <div id="loader" class="fixed inset-0 z-[100] flex items-center justify-center bg-white dark:bg-slate-950">
        <div class="flex flex-col items-center">
            <div class="w-12 h-12 border-4 border-blue-500/20 border-t-blue-600 rounded-full animate-spin"></div>
            <p class="mt-4 font-medium animate-pulse">Optmizing Engine...</p>
        </div>
    </div>

    <div id="app" class="flex h-full w-full opacity-0 transition-opacity duration-500">
        
        <aside id="sidebar" class="fixed lg:relative inset-y-0 left-0 z-50 w-[var(--sidebar-w)] transform -translate-x-full lg:translate-x-0 bg-slate-50 dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 transition-all">
            <div class="flex flex-col h-full">
                <div class="p-4 flex items-center justify-between">
                    <span class="text-xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">AI Assistant</span>
                    <button onclick="toggleSidebar()" class="lg:hidden p-2"><i class="fas fa-xmark"></i></button>
                </div>

                <button onclick="newChat()" class="mx-4 mb-4 p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition-all flex items-center gap-3">
                    <i class="fas fa-plus text-blue-500"></i>
                    <span class="font-medium text-sm">New Conversation</span>
                </button>

                <div id="history-list" class="flex-1 overflow-y-auto px-3 space-y-1">
                    </div>

                <div class="p-4 mt-auto border-t dark:border-slate-800 space-y-1">
                    <button onclick="toggleTheme()" class="w-full flex items-center gap-3 p-3 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-xl transition-all">
                        <i class="fas fa-circle-half-stroke"></i> <span class="text-sm">Theme</span>
                    </button>
                    <button onclick="openSettings()" class="w-full flex items-center gap-3 p-3 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-xl transition-all">
                        <i class="fas fa-sliders"></i> <span class="text-sm">Settings</span>
                    </button>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col min-w-0 relative">
            
            <header class="h-16 flex items-center justify-between px-4 lg:px-8 border-b dark:border-slate-800 glass z-40">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()" class="lg:hidden p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg"><i class="fas fa-bars"></i></button>
                    <div class="flex flex-col">
                        <h2 id="chat-title" class="font-semibold text-sm truncate max-w-[150px] lg:max-w-md">New Chat</h2>
                        <span id="active-model" class="text-[10px] uppercase tracking-widest text-blue-500 font-bold"></span>
                    </div>
                </div>
                <div id="status-dot" class="flex items-center gap-2 text-xs text-green-500">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                    </span>
                    Ready
                </div>
            </header>

            <div id="chat-view" class="flex-1 overflow-y-auto chat-scroll p-4 lg:p-8 space-y-8 pb-40">
                </div>

            <div class="absolute bottom-0 inset-x-0 p-4 lg:p-6 bg-gradient-to-t from-white dark:from-slate-950 via-white/90 dark:via-slate-950/90">
                <div class="max-w-4xl mx-auto">
                    <div class="relative group">
                        <textarea id="prompt" rows="1" oninput="autoResize(this)"
                            class="w-full p-4 lg:p-5 pr-16 rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-blue-500 focus:ring-0 transition-all outline-none resize-none shadow-lg shadow-blue-500/5"
                            placeholder="Ask anything..."></textarea>
                        
                        <button id="send-btn" onclick="askAI()" 
                            class="absolute right-3 bottom-3 p-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-lg shadow-blue-500/30 transition-all disabled:grayscale disabled:opacity-50">
                            <i class="fas fa-arrow-up"></i>
                        </button>
                    </div>
                    <div class="flex justify-center gap-4 mt-3">
                        <button class="text-[10px] px-2 py-1 rounded bg-slate-100 dark:bg-slate-800 hover:bg-blue-100 dark:hover:bg-blue-900 transition-all" onclick="setPrompt('Write a blog post about...')">📝 Blog</button>
                        <button class="text-[10px] px-2 py-1 rounded bg-slate-100 dark:bg-slate-800 hover:bg-blue-100 dark:hover:bg-blue-900 transition-all" onclick="setPrompt('Explain this code:')">💻 Code</button>
                        <button class="text-[10px] px-2 py-1 rounded bg-slate-100 dark:bg-slate-800 hover:bg-blue-100 dark:hover:bg-blue-900 transition-all" onclick="setPrompt('Summarize this text:')">📄 Summary</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="settings" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4 glass">
        <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-3xl p-8 border border-slate-200 dark:border-slate-800 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">Engine Configuration</h3>
                <button onclick="closeSettings()" class="p-2"><i class="fas fa-times"></i></button>
            </div>
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-bold uppercase mb-2 opacity-60">OpenRouter API Key</label>
                    <input type="password" id="key" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border-none focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase mb-2 opacity-60">AI Model</label>
                    <input type="text" id="model" placeholder="deepseek/deepseek-r1:free" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border-none focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button onclick="saveSettings()" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-xl shadow-blue-600/20 hover:scale-[1.02] transition-all">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // Internal State
        const $ = (id) => document.getElementById(id);
        let state = {
            chats: JSON.parse(localStorage.getItem('chats') || '[]'),
            currentId: null,
            isThinking: false
        };

        // App Initialization
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                $('loader').classList.add('hidden');
                $('app').classList.replace('opacity-0', 'opacity-100');
                
                // Load Settings
                $('key').value = localStorage.getItem('apiKey') || '';
                $('model').value = localStorage.getItem('model') || 'deepseek/deepseek-r1:free';
                
                if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
                
                if(state.chats.length > 0) loadChat(state.chats[0].id);
                else newChat();
                
                renderHistory();
                updateModelBadge();
            }, 300);
        });

        // Functions
        function toggleSidebar() { $('sidebar').classList.toggle('-translate-x-full'); }
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function openSettings() { $('settings').classList.remove('hidden'); }
        function closeSettings() { $('settings').classList.add('hidden'); }
        
        function saveSettings() {
            localStorage.setItem('apiKey', $('key').value.trim());
            localStorage.setItem('model', $('model').value.trim() || 'deepseek/deepseek-r1:free');
            updateModelBadge();
            closeSettings();
        }

        function updateModelBadge() {
            $('active-model').innerText = (localStorage.getItem('model') || 'deepseek/deepseek-r1:free').split('/')[1] || 'Default';
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight) + 'px';
        }

        function setPrompt(text) {
            $('prompt').value = text;
            $('prompt').focus();
            autoResize($('prompt'));
        }

        // Chat Logic
        function newChat() {
            const id = 'ch_' + Date.now();
            state.chats.unshift({ id, title: 'New Chat', messages: [] });
            loadChat(id);
            renderHistory();
        }

        function loadChat(id) {
            state.currentId = id;
            const chat = state.chats.find(c => c.id === id);
            $('chat-title').innerText = chat.title;
            renderMessages();
            if(window.innerWidth < 1024) toggleSidebar();
        }

        function renderHistory() {
            $('history-list').innerHTML = state.chats.map(c => `
                <div onclick="loadChat('${c.id}')" class="flex items-center gap-3 p-3 rounded-xl cursor-pointer group transition-all ${state.currentId === c.id ? 'bg-blue-100 dark:bg-blue-900/30 text-blue-600' : 'hover:bg-slate-200 dark:hover:bg-slate-800'}">
                    <i class="far fa-message text-xs opacity-50"></i>
                    <span class="flex-1 truncate text-sm font-medium">${c.title}</span>
                    <button onclick="event.stopPropagation(); deleteChat('${c.id}')" class="opacity-0 group-hover:opacity-100 p-1 hover:text-red-500"><i class="fas fa-trash-can text-[10px]"></i></button>
                </div>
            `).join('');
        }

        function deleteChat(id) {
            state.chats = state.chats.filter(c => c.id !== id);
            localStorage.setItem('chats', JSON.stringify(state.chats));
            if(state.currentId === id) state.chats.length > 0 ? loadChat(state.chats[0].id) : newChat();
            renderHistory();
        }

        function renderMessages() {
            const chat = state.chats.find(c => c.id === state.currentId);
            $('chat-view').innerHTML = chat.messages.map(m => `
                <div class="flex ${m.role === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in duration-300">
                    <div class="max-w-[85%] lg:max-w-3xl p-4 lg:p-6 rounded-3xl ${m.role === 'user' ? 'bg-blue-600 text-white rounded-tr-none shadow-xl shadow-blue-600/10' : 'bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-tl-none'} shadow-sm">
                        <div class="prose dark:prose-invert text-sm lg:text-base leading-relaxed">
                            ${marked.parse(m.content)}
                        </div>
                    </div>
                </div>
            `).join('');
            $('chat-view').scrollTo(0, $('chat-view').scrollHeight);
        }

        // The Engine (Streaming)
        async function askAI() {
            const text = $('prompt').value.trim();
            const key = localStorage.getItem('apiKey');
            const model = localStorage.getItem('model') || 'deepseek/deepseek-r1:free';

            if(!text || state.isThinking) return;
            if(!key) return openSettings();

            state.isThinking = true;
            $('send-btn').disabled = true;
            
            const chat = state.chats.find(c => c.id === state.currentId);
            if(chat.messages.length === 0) chat.title = text.slice(0, 30);
            
            chat.messages.push({ role: 'user', content: text });
            $('prompt').value = '';
            $('prompt').style.height = 'auto';
            renderMessages();

            // AI Placeholder
            const aiMsg = { role: 'assistant', content: '' };
            chat.messages.push(aiMsg);
            renderMessages();

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: model,
                        messages: chat.messages.slice(0, -1),
                        stream: true
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                const chatView = $('chat-view');

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const lines = decoder.decode(value).split('\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const dataStr = line.slice(6);
                            if (dataStr === '[DONE]') break;
                            try {
                                const json = JSON.parse(dataStr);
                                aiMsg.content += json.choices[0].delta.content || '';
                                
                                // Real-time render optimization
                                const lastMsgDiv = chatView.lastElementChild.querySelector('.prose');
                                lastMsgDiv.innerHTML = marked.parse(aiMsg.content);
                                chatView.scrollTo(0, chatView.scrollHeight);
                            } catch (e) {}
                        }
                    }
                }
            } catch (err) {
                aiMsg.content = "⚠️ Connection Error. Please verify your key.";
                renderMessages();
            } finally {
                state.isThinking = false;
                $('send-btn').disabled = false;
                localStorage.setItem('chats', JSON.stringify(state.chats));
                renderHistory();
            }
        }
    </script>
</body>
</html>
