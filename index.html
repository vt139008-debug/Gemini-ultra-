<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Creator Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:Inter, sans-serif}
body{margin:0;background:#0b0f19;color:#e6ebff}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:#11182a;border-bottom:1px solid #1f2a44}
header h1{font-size:18px;margin:0}
.container{display:flex;height:calc(100vh - 60px)}
.sidebar{width:230px;background:#0f1628;border-right:1px solid #1f2a44;padding:12px}
.sidebar button{width:100%;padding:12px;margin-bottom:10px;border-radius:10px;border:0;background:#18223a;color:#cfd8ff;cursor:pointer}
.sidebar button.active{background:#3b82f6;color:white}
.main{flex:1;display:flex;flex-direction:column}
.panel{padding:18px;display:none;height:100%;overflow:auto}
.panel.active{display:block}
.card{background:#11182a;border:1px solid #1f2a44;border-radius:14px;padding:16px;margin-bottom:16px}
label{font-size:13px;color:#9fb0ff}
input,textarea,select{width:100%;margin-top:6px;margin-bottom:12px;padding:12px;border-radius:10px;border:1px solid #263459;background:#0c1324;color:white}
textarea{min-height:100px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{background:#3b82f6;border:0;padding:12px;border-radius:10px;color:white;font-weight:600;cursor:pointer}
.btn.secondary{background:#223055}
.preview{width:100%;min-height:260px;border:2px dashed #263459;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#6b7bb3}
img,video{max-width:100%;border-radius:12px}
.small{font-size:12px;color:#8b9ad6}
.api-row{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-bottom:10px}
</style>
</head>
<body><header>
<h1>AI Creator Studio</h1>
<div class="small">Text → Image • Image → Video • Multi API</div>
</header><div class="container"><div class="sidebar">
<button class="active" onclick="showPanel('text2img')">Text → Image</button>
<button onclick="showPanel('img2vid')">Image → Video</button>
<button onclick="showPanel('history')">History</button>
<button onclick="showPanel('settings')">Settings</button>
</div><div class="main"><!-- TEXT TO IMAGE --><div id="text2img" class="panel active">
<div class="card">
<h3>Text to Image Generator</h3>
<textarea id="t2iPrompt" placeholder="Describe your image..."></textarea>
<div class="row">
<select id="t2iStyle">
<option>Realistic</option>
<option>Anime</option>
<option>3D Render</option>
<option>Cinematic</option>
</select>
<select id="t2iQuality">
<option>HD</option>
<option>2K</option>
<option>4K</option>
</select>
</div>
<button class="btn" onclick="generateImage()">Generate Image</button>
</div><div class="card">
<h3>Preview</h3>
<div class="preview" id="imagePreview">No image yet</div>
</div>
</div><!-- IMAGE TO VIDEO --><div id="img2vid" class="panel">
<div class="card">
<h3>Image to Video Generator</h3>
<input type="file" id="imageInput" accept="image/*" />
<textarea id="i2vPrompt" placeholder="Describe motion, camera, mood..."></textarea>
<div class="row">
<select id="duration">
<option value="4">4 sec</option>
<option value="6">6 sec</option>
<option value="8">8 sec</option>
</select>
<select id="motion">
<option>Zoom</option>
<option>Pan</option>
<option>Rotate</option>
<option>Drone</option>
</select>
</div>
<button class="btn" onclick="generateVideo()">Generate Video</button>
</div><div class="card">
<h3>Preview</h3>
<div class="preview" id="videoPreview">No video yet</div>
</div>
</div><!-- HISTORY --><div id="history" class="panel">
<div class="card">
<h3>Generation History</h3>
<div id="historyList" class="small"></div>
</div>
</div><!-- SETTINGS --><div id="settings" class="panel">
<div class="card">
<h3>API Integrations</h3>
<div class="api-row"><input placeholder="Text→Image API URL" id="api_t2i_url"><input placeholder="API Key" id="api_t2i_key"></div>
<div class="api-row"><input placeholder="Image→Video API URL" id="api_i2v_url"><input placeholder="API Key" id="api_i2v_key"></div>
<div class="api-row"><input placeholder="Alt Provider URL" id="api_alt_url"><input placeholder="API Key" id="api_alt_key"></div>
<button class="btn secondary" onclick="saveSettings()">Save Settings</button>
</div><div class="card">
<h3>App Options</h3>
<select id="themeSelect" onchange="setTheme(this.value)">
<option value="dark">Dark</option>
<option value="light">Light</option>
</select>
</div>
</div></div>
</div><script>
function showPanel(id){
 document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.querySelectorAll('.sidebar button').forEach(b=>b.classList.remove('active'));
 event.target.classList.add('active');
}

function addHistory(text){
 const el=document.getElementById('historyList');
 const div=document.createElement('div');
 div.textContent=new Date().toLocaleTimeString()+" — "+text;
 el.prepend(div);
}

async function generateImage(){
 const prompt=document.getElementById('t2iPrompt').value;
 const style=document.getElementById('t2iStyle').value;
 const quality=document.getElementById('t2iQuality').value;
 const box=document.getElementById('imagePreview');
 box.innerHTML='Generating...';

 // ===== API SLOT =====
 const url=localStorage.getItem('api_t2i_url');
 const key=localStorage.getItem('api_t2i_key');

 if(!url){ box.innerHTML='Set API in settings'; return; }

 try{
 const res=await fetch(url,{
 method:'POST',
 headers:{'Content-Type':'application/json','Authorization':key},
 body:JSON.stringify({prompt,style,quality})
 });
 const data=await res.json();
 const img=document.createElement('img');
 img.src=data.image_url;
 box.innerHTML='';
 box.appendChild(img);
 addHistory('Text→Image generated');
 }catch(e){ box.innerHTML='API Error'; }
}

async function generateVideo(){
 const file=document.getElementById('imageInput').files[0];
 if(!file) return alert('Upload image');
 const prompt=document.getElementById('i2vPrompt').value;
 const duration=document.getElementById('duration').value;
 const motion=document.getElementById('motion').value;
 const box=document.getElementById('videoPreview');
 box.innerHTML='Generating...';

 const url=localStorage.getItem('api_i2v_url');
 const key=localStorage.getItem('api_i2v_key');
 if(!url){ box.innerHTML='Set API in settings'; return; }

 const form=new FormData();
 form.append('image',file);
 form.append('prompt',prompt);
 form.append('duration',duration);
 form.append('motion',motion);

 try{
 const res=await fetch(url,{method:'POST',headers:{'Authorization':key},body:form});
 const data=await res.json();
 const vid=document.createElement('video');
 vid.controls=true;
 vid.src=data.video_url;
 box.innerHTML='';
 box.appendChild(vid);
 addHistory('Image→Video generated');
 }catch(e){ box.innerHTML='API Error'; }
}

function saveSettings(){
 ['api_t2i_url','api_t2i_key','api_i2v_url','api_i2v_key','api_alt_url','api_alt_key']
 .forEach(id=>localStorage.setItem(id,document.getElementById(id).value));
 alert('Saved');
}

function setTheme(v){
 if(v==='light') document.body.style.background='#f4f6ff';
 else document.body.style.background='#0b0f19';
}
</script></body>
</html>
